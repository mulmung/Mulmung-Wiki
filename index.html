<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>물멍위키</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111827;
      line-height: 1.6;
    }

    .header {
      background: #ffffff;
      padding: 40px 20px 30px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      max-width: 420px;
      width: 100%;
      height: auto;
    }

    .menu {
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .menu button {
      background: #000000;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .content {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      font-size: 30px;
      margin-bottom: 18px;
      color: #111827;
    }

    .card p {
      font-size: 18px;
      margin-bottom: 14px;
    }
  </style>
</head>

<body>
  <header class="header">
    <img src="logo.png" alt="물멍위키 로고" class="logo" />
  </header>

  <nav class="menu">
    <button onclick="location.href='#intro'">들어가며</button>
  </nav>

  <main class="content">
    <section id="intro" class="card">
      <h2>들어가며</h2>
      <p>
        이곳은 물멍위키의 시작 페이지입니다.
      </p>
      <p>
        앞으로 슬레이어 키우기를 처음 시작하는 유저들이 쉽게 이해할 수 있도록
        하나씩 내용을 정리해 나갈 예정입니다.
      </p>
    </section>
  </main>
</body>
</html>
